<title id="t">AI agent architecture lesson excerpt</title><desc id="d">A safe agent system with goals, context, tools, approvals, evaluation, and stop conditions.</desc>
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#141a31"/><stop offset="1" stop-color="#291743"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/>
<text x="100" y="110" fill="#c4ff72" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">MODULE 05 · AI AGENTS</text><text x="100" y="183" fill="#fff" font-family="Arial" font-size="58" font-weight="800">Autonomy needs a control system.</text>
<g font-family="Arial" text-anchor="middle"><circle cx="800" cy="470" r="145" fill="#f7f8ff"/><text x="800" y="455" fill="#202943" font-size="31" font-weight="800">AGENT LOOP</text><text x="800" y="500" fill="#57617b" font-size="22">observe · decide · act</text><g fill="#fff"><rect x="145" y="290" width="300" height="115" rx="26"/><rect x="145" y="530" width="300" height="115" rx="26"/><rect x="1155" y="290" width="300" height="115" rx="26"/><rect x="1155" y="530" width="300" height="115" rx="26"/></g><g fill="#202943" font-size="27" font-weight="700"><text x="295" y="360">Goal + context</text><text x="295" y="600">Tools + budget</text><text x="1305" y="360">Approval gates</text><text x="1305" y="600">Evidence + evals</text></g><rect x="620" y="690" width="360" height="90" rx="45" fill="#c4ff72"/><text x="800" y="747" fill="#202943" font-size="26" font-weight="800">STOP CONDITIONS</text></g>
<g stroke="#7f8cff" stroke-width="7" fill="none"><path d="M445 348 680 415M445 588l235-64M1155 348l-235 67M1155 588l-235-64M800 615v75"/></g><text x="100" y="835" fill="#c8c9dc" font-family="Arial" font-size="25">Start bounded. Measure failures. Expand permissions only after evidence.</text>
