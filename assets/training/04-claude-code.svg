<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Claude Code lesson excerpt</title><desc id="d">A safe agentic coding loop: inspect, plan, change, test, review.</desc>
<rect width="1600" height="900" fill="#10121a"/><text x="105" y="110" fill="#ffb59b" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">MODULE 04 · CLAUDE CODE</text><text x="105" y="184" fill="#fff" font-family="Arial" font-size="56" font-weight="800">Describe the outcome. Verify the change.</text>
<rect x="105" y="255" width="1390" height="470" rx="36" fill="#181c28" stroke="#31394e" stroke-width="3"/><g font-family="Consolas, monospace" font-size="23"><text x="155" y="320" fill="#7f8cff">$ task</text><text x="265" y="320" fill="#e3e8f5">Build a pricing calculator with tests and no external data.</text><text x="155" y="378" fill="#69dfbe">✓ inspect</text><text x="330" y="378" fill="#aeb9d0">Read the project and constraints</text><text x="155" y="436" fill="#69dfbe">✓ plan</text><text x="330" y="436" fill="#aeb9d0">Name files, acceptance tests, and risks</text><text x="155" y="494" fill="#69dfbe">✓ change</text><text x="330" y="494" fill="#aeb9d0">Make the smallest in-scope edits</text><text x="155" y="552" fill="#69dfbe">✓ test</text><text x="330" y="552" fill="#aeb9d0">Run checks and read failures</text><text x="155" y="610" fill="#f4b860">→ review</text><text x="330" y="610" fill="#fff">Show evidence before shipping</text></g><rect x="1040" y="350" width="365" height="260" rx="24" fill="#0d0f16"/><text x="1080" y="402" fill="#ffb59b" font-family="Arial" font-size="22" font-weight="700">PERMISSION BOUNDARY</text><g fill="#c2cada" font-family="Arial" font-size="21"><text x="1080" y="458">Local files only</text><text x="1080" y="505">No secrets in code</text><text x="1080" y="552">Ask before external actions</text></g>
<text x="105" y="810" fill="#aeb9d0" font-family="Arial" font-size="26">A passing test is evidence—not proof that every user need is satisfied.</text>
</svg>
