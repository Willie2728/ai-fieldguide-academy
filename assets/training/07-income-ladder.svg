<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Responsible AI income lesson excerpt</title><desc id="d">A five-step ladder from customer problem to paid pilot and measured retention.</desc>
<defs><linearGradient id="b" y2="1"><stop stop-color="#0c1825"/><stop offset="1" stop-color="#102f35"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><text x="100" y="110" fill="#f4b860" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">MODULE 09 · RESPONSIBLE AI INCOME</text><text x="100" y="184" fill="#fff" font-family="Arial" font-size="57" font-weight="800">Solve a real problem before scaling a promise.</text>
<g font-family="Arial" font-weight="700"><g transform="translate(110 610)"><rect width="250" height="110" rx="24" fill="#f6f8fb"/><text x="34" y="64" fill="#173044" font-size="25">1 · Painful problem</text></g><g transform="translate(390 520)"><rect width="250" height="200" rx="24" fill="#e8f8f3"/><text x="34" y="62" fill="#173044" font-size="25">2 · Useful skill</text><text x="34" y="110" fill="#55706f" font-size="20" font-weight="400">Show evidence you</text><text x="34" y="140" fill="#55706f" font-size="20" font-weight="400">can deliver value.</text></g><g transform="translate(670 420)"><rect width="250" height="300" rx="24" fill="#fff3df"/><text x="34" y="62" fill="#173044" font-size="25">3 · Paid pilot</text><text x="34" y="110" fill="#6f6555" font-size="20" font-weight="400">Bounded scope, price</text><text x="34" y="140" fill="#6f6555" font-size="20" font-weight="400">hypothesis, success</text><text x="34" y="170" fill="#6f6555" font-size="20" font-weight="400">and failure criteria.</text></g><g transform="translate(950 320)"><rect width="250" height="400" rx="24" fill="#eceeff"/><text x="34" y="62" fill="#173044" font-size="25">4 · Repeatable offer</text><text x="34" y="110" fill="#5b5f7c" font-size="20" font-weight="400">Standard steps, honest</text><text x="34" y="140" fill="#5b5f7c" font-size="20" font-weight="400">claims, quality checks,</text><text x="34" y="170" fill="#5b5f7c" font-size="20" font-weight="400">and clear exclusions.</text></g><g transform="translate(1230 220)"><rect width="250" height="500" rx="24" fill="#4ee1c1"/><text x="34" y="62" fill="#102f35" font-size="25">5 · Retention</text><text x="34" y="110" fill="#1a544f" font-size="20" font-weight="400">Measure satisfaction,</text><text x="34" y="140" fill="#1a544f" font-size="20" font-weight="400">renewal, churn, cost,</text><text x="34" y="170" fill="#1a544f" font-size="20" font-weight="400">and sustainable MRR.</text></g></g>
<text x="100" y="820" fill="#bed2d5" font-family="Arial" font-size="26">Income is never guaranteed. Validate demand with a small paid test and real customer evidence.</text>
</svg>
