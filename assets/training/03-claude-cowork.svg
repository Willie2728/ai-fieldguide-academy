<title id="t">Claude Cowork lesson excerpt</title><desc id="d">A bounded delegation flow for knowledge work across selected files.</desc>
<rect width="1600" height="900" fill="#f3efe8"/><text x="100" y="110" fill="#a34e36" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">MODULE 03 · CLAUDE COWORK</text><text x="100" y="182" fill="#241c19" font-family="Arial" font-size="56" font-weight="800">Delegate the outcome. Bound the workspace.</text>
<g font-family="Arial"><rect x="100" y="265" width="430" height="400" rx="34" fill="#fff" stroke="#d5c8bc" stroke-width="3"/><text x="145" y="330" fill="#a34e36" font-size="25" font-weight="700">SELECTED WORKSPACE</text><g fill="#efe7dd"><rect x="145" y="375" width="340" height="62" rx="14"/><rect x="145" y="457" width="340" height="62" rx="14"/><rect x="145" y="539" width="340" height="62" rx="14"/></g><g fill="#4a3d36" font-size="24"><text x="176" y="415">Research notes</text><text x="176" y="497">Customer feedback</text><text x="176" y="579">Report template</text></g>
<rect x="610" y="265" width="380" height="400" rx="34" fill="#241c19"/><text x="655" y="330" fill="#f3b49e" font-size="25" font-weight="700">TASK CONTRACT</text><g fill="#f8f2ed" font-size="24"><text x="655" y="400">Goal</text><text x="655" y="458">Allowed files</text><text x="655" y="516">Quality checks</text><text x="655" y="574">Approval gate</text></g><g fill="#f3b49e"><circle cx="925" cy="391" r="8"/><circle cx="925" cy="449" r="8"/><circle cx="925" cy="507" r="8"/><circle cx="925" cy="565" r="8"/></g>
<rect x="1070" y="265" width="430" height="400" rx="34" fill="#fff" stroke="#d5c8bc" stroke-width="3"/><text x="1115" y="330" fill="#a34e36" font-size="25" font-weight="700">REVIEWED DELIVERABLE</text><path d="M1150 390h270M1150 442h230M1150 494h270M1150 546h180" stroke="#d5c8bc" stroke-width="18" stroke-linecap="round"/><rect x="1150" y="587" width="230" height="48" rx="24" fill="#b85f43"/><text x="1265" y="618" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">HUMAN APPROVAL</text></g>
<path d="M530 465h80M990 465h80" stroke="#a34e36" stroke-width="8"/><text x="100" y="805" fill="#6d5b51" font-family="Arial" font-size="26">Consequential decisions stay with the learner. Access is limited to the work placed in scope.</text>
