<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">AI Foundations lesson excerpt</title><desc id="d">A three-stage workflow from human judgment through AI assistance to verified output.</desc>
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172640"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-opacity=".28"/></filter></defs>
<rect width="1600" height="900" fill="url(#b)"/><circle cx="1340" cy="110" r="250" fill="#4ee1c1" opacity=".08"/>
<text x="110" y="130" fill="#4ee1c1" font-family="Arial" font-size="26" font-weight="700" letter-spacing="5">MODULE 01 · AI FOUNDATIONS</text><text x="110" y="205" fill="#fff" font-family="Arial" font-size="58" font-weight="800">Use AI inside a human review loop.</text>
<g filter="url(#s)" font-family="Arial"><g transform="translate(110 330)"><rect width="390" height="310" rx="34" fill="#f6f8fb"/><circle cx="68" cy="72" r="34" fill="#f4b860"/><text x="52" y="85" font-size="38" font-weight="800">1</text><text x="44" y="158" fill="#0b1220" font-size="34" font-weight="800">Human judgment</text><text x="44" y="211" fill="#55647a" font-size="24">Set the goal, supply context,</text><text x="44" y="246" fill="#55647a" font-size="24">and define what “good” means.</text></g>
<g transform="translate(605 330)"><rect width="390" height="310" rx="34" fill="#f6f8fb"/><circle cx="68" cy="72" r="34" fill="#4ee1c1"/><text x="52" y="85" font-size="38" font-weight="800">2</text><text x="44" y="158" fill="#0b1220" font-size="34" font-weight="800">AI assistance</text><text x="44" y="211" fill="#55647a" font-size="24">Draft, compare, transform,</text><text x="44" y="246" fill="#55647a" font-size="24">or analyze within boundaries.</text></g>
<g transform="translate(1100 330)"><rect width="390" height="310" rx="34" fill="#f6f8fb"/><circle cx="68" cy="72" r="34" fill="#7f8cff"/><text x="52" y="85" fill="#fff" font-size="38" font-weight="800">3</text><text x="44" y="158" fill="#0b1220" font-size="34" font-weight="800">Verified output</text><text x="44" y="211" fill="#55647a" font-size="24">Check facts, policy, quality,</text><text x="44" y="246" fill="#55647a" font-size="24">and consequences before use.</text></g></g>
<path d="M500 486h105M995 486h105" stroke="#f4b860" stroke-width="8" stroke-linecap="round"/><path d="m582 466 25 20-25 20M1077 466l25 20-25 20" fill="none" stroke="#f4b860" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="790" fill="#b8c5d9" font-family="Arial" font-size="26">Willie’s rule: confidence is not evidence. Verify important work.</text>
</svg>
