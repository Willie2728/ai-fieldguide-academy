<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">ChatGPT workbench lesson excerpt</title><desc id="d">A practical screen showing five workplace task patterns and a quality checklist.</desc>
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#edf7f3"/><stop offset="1" stop-color="#dce7ff"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/>
<text x="100" y="110" fill="#126457" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">MODULE 02 · CHATGPT AT WORK</text><text x="100" y="183" fill="#10233c" font-family="Arial" font-size="58" font-weight="800">Build a five-task AI workbench.</text>
<rect x="100" y="245" width="1400" height="520" rx="38" fill="#fff" stroke="#cbd8e5" stroke-width="3"/>
<g font-family="Arial" font-weight="700" font-size="28"><g transform="translate(150 310)"><rect width="300" height="110" rx="24" fill="#e8f8f3"/><text x="34" y="66" fill="#126457">01 · Summarize</text></g><g transform="translate(475 310)"><rect width="300" height="110" rx="24" fill="#eef0ff"/><text x="34" y="66" fill="#4c58b4">02 · Draft</text></g><g transform="translate(800 310)"><rect width="300" height="110" rx="24" fill="#fff3df"/><text x="34" y="66" fill="#9c6212">03 · Analyze</text></g><g transform="translate(1125 310)"><rect width="300" height="110" rx="24" fill="#ffecef"/><text x="34" y="66" fill="#ad3e56">04 · Plan</text></g></g>
<rect x="150" y="455" width="1275" height="100" rx="24" fill="#10233c"/><text x="190" y="520" fill="#fff" font-family="Arial" font-size="30" font-weight="700">05 · Transform: one source → email, brief, checklist, or presentation outline</text>
<text x="150" y="625" fill="#52647a" font-family="Arial" font-size="25">Quality check</text><g fill="#10233c" font-family="Arial" font-size="23"><text x="150" y="681">✓ Facts preserved</text><text x="455" y="681">✓ Assumptions labeled</text><text x="810" y="681">✓ Private data protected</text><text x="1160" y="681">✓ Human approved</text></g>
<text x="100" y="830" fill="#52647a" font-family="Arial" font-size="25">Start with a real task. Measure time and quality before claiming improvement.</text>
</svg>
