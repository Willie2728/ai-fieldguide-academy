<title id="t">Prompt Like a Pro lesson excerpt</title><desc id="d">The P.R.O. prompting method: Purpose, Relevant context, and Output contract.</desc>
<rect width="1600" height="900" fill="#fff9ee"/><text x="100" y="110" fill="#a66216" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">MODULE 06 · PROMPT LIKE A P.R.O.</text><text x="100" y="183" fill="#1c2738" font-family="Arial" font-size="57" font-weight="800">A strong prompt is a small work contract.</text>
<g font-family="Arial"><g transform="translate(100 275)"><rect width="430" height="410" rx="36" fill="#1c2738"/><circle cx="80" cy="84" r="50" fill="#f4b860"/><text x="63" y="102" font-size="54" font-weight="800">P</text><text x="52" y="184" fill="#fff" font-size="34" font-weight="800">PURPOSE</text><text x="52" y="240" fill="#c8d0dc" font-size="24">Outcome</text><text x="52" y="282" fill="#c8d0dc" font-size="24">Audience</text><text x="52" y="324" fill="#c8d0dc" font-size="24">Definition of done</text></g><g transform="translate(585 275)"><rect width="430" height="410" rx="36" fill="#edf6f3"/><circle cx="80" cy="84" r="50" fill="#4ee1c1"/><text x="63" y="102" font-size="54" font-weight="800">R</text><text x="52" y="184" fill="#1c2738" font-size="34" font-weight="800">RELEVANT CONTEXT</text><text x="52" y="240" fill="#52647a" font-size="24">Sources</text><text x="52" y="282" fill="#52647a" font-size="24">Constraints</text><text x="52" y="324" fill="#52647a" font-size="24">Examples + assumptions</text></g><g transform="translate(1070 275)"><rect width="430" height="410" rx="36" fill="#eceeff"/><circle cx="80" cy="84" r="50" fill="#7f8cff"/><text x="62" y="102" fill="#fff" font-size="54" font-weight="800">O</text><text x="52" y="184" fill="#1c2738" font-size="34" font-weight="800">OUTPUT CONTRACT</text><text x="52" y="240" fill="#52647a" font-size="24">Format + tone</text><text x="52" y="282" fill="#52647a" font-size="24">Length + checks</text><text x="52" y="324" fill="#52647a" font-size="24">Next action</text></g></g>
